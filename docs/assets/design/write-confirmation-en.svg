    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #152a2d" x="360" y="140.687" transform="rotate(-0 360 140.687)">Concurrent requests → writer execution and grouping</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #152a2d" x="360" y="243.206859" transform="rotate(-0 360 243.206859)">Confirmation for this write</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(111.325469 342.734125)">Performance: publish</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(127.623437 359.643937)">in-memory view</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #152a2d" x="537.84" y="351.147469" transform="rotate(-0 537.84 351.147469)">Reliable / force reliable</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(131.154063 456.920562)">Return success;</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(102.300937 473.830375)">new reads see the value</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(121.392109 577.451516)">Period / threshold /</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(144.517891 593.153484)">explicit sync</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(482.039062 498.964094)">Physical writes +</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(475.845156 515.954844)">persistence barrier</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(471.209922 649.633094)">Reliable path: publish</text>
    <text style="font-size: 13px; font-family: 'Microsoft YaHei'; fill: #152a2d" transform="translate(454.989375 665.335062)">durable view, then confirm</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; fill: #506264" transform="translate(45.36 677.702375)">Pending performance-mode bytes</text>
