syntax = "proto3";
package fengqudb.example.v1;
option csharp_namespace = "FengquDB.Examples.V1";
option java_package = "io.fengqudb.examples.v1";
option java_outer_classname = "PlayerV1Schema";

// optional preserves explicit zero/empty values for required field indexes.
message PlayerSave {
  optional uint64 player_id = 1;
  optional string display_name = 2;
  optional sint64 coins = 3;
  repeated string tags = 4;
  Inventory inventory = 5;
  map<string, sint64> counters = 6;
  bytes avatar_token = 7;
  reserved 10;
  reserved "old_level";
}
message Inventory { repeated InventoryItem items = 1; }
message InventoryItem { uint32 item_id = 1; uint32 count = 2; }
