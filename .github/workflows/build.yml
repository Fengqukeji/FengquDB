name: Apple SDK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-sdk:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Apple libraries and verify host/device/simulator links
        run: sh scripts/build-apple-sdk.sh artifacts/apple-sdk build/apple-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: FengquDB-Apple-SDK
          path: artifacts/apple-sdk
          if-no-files-found: error
