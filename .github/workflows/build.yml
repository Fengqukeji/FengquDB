name: native-and-bindings
on: [push, pull_request, workflow_dispatch]
jobs:
  sanitizers:
    name: Linux ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      CC: gcc-12
      CXX: g++-12
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure isolated sanitizer build
        run: >-
          cmake -S . -B build/sanitizer-${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFQDB_SANITIZER=${{ matrix.sanitizer }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DFQDB_SHARED=OFF -DFQDB_RELEASE_IPO=OFF -DFQDB_BUILD_TOOLS=OFF
          -DFQDB_BUILD_DIAGNOSTICS=OFF -DBUILD_TESTING=ON
      - name: Build concurrency and query regressions
        run: >-
          cmake --build build/sanitizer-${{ matrix.sanitizer }} --parallel 2 --target
          fqdb_header_self_containment fqdb_write_policy_tests fqdb_committed_cache_tests
          fqdb_atomic_owner_tests fqdb_store_sdk_tests fqdb_store_select_tests fqdb_store_query_tests
      - name: Run instrumented tests
        env:
          FQDB_TEST_PYTHON: python3
          FQDB_TEST_CLEANER: ${{ github.workspace }}/tests/store_fixture_cleanup.py
          FQDB_TEST_OWNED_ROOT: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: >-
          ctest --test-dir build/sanitizer-${{ matrix.sanitizer }} --output-on-failure
          --output-junit results.xml
          -R '^paged_(write_policy|committed_cache|atomic_owner|store_sdk|select|query)$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitizer-${{ matrix.sanitizer }}-logs
          path: |
            build/sanitizer-${{ matrix.sanitizer }}/CMakeCache.txt
            build/sanitizer-${{ matrix.sanitizer }}/compile_commands.json
            build/sanitizer-${{ matrix.sanitizer }}/results.xml
            build/sanitizer-${{ matrix.sanitizer }}/Testing/Temporary/
  build:
    env:
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      MSBUILDDISABLENODEREUSE: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFQDB_BUILD_JNI=ON
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Bindings and SDK
        shell: pwsh
        run: |
          $native = if ($IsWindows) { "$PWD/build/Release" } else { "$PWD/build" }
          $lib = if ($IsWindows) { "$native/fengqudb.dll" } else { "$native/libfengqudb.so" }
          $env:PATH = "$native$([IO.Path]::PathSeparator)$env:PATH"
          $env:LD_LIBRARY_PATH = $native
          $codegen = if ($IsWindows) { "$PWD/build/tools/codegen/Release/fqdb-codegen.exe" } else { "$PWD/build/tools/codegen/fqdb-codegen" }
          python tests/codegen/verify.py --cli $codegen --output "$PWD/build/ci-native-codegen" --languages python,node,c,cpp,csharp,java,go,rust --library $lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/codegen/source_verify.py --cli $codegen --output "$PWD/build/ci-source-codegen" --languages python,node,c,cpp,csharp,java,go,rust --library $lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/codegen/lock_verify.py --cli $codegen --output "$PWD/build/ci-codegen-lock"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install setuptools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/codegen/python_build_verify.py --cli $codegen --output "$PWD/build/ci-python-package-build"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify-store-bindings.py --library $lib --output "$PWD/build/ci-bindings"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/csharp/GeneratorTests/GeneratorTests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tools/FengquDB.CodeGen/FengquDB.CodeGen.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/csharp/codegen_cli_tests.py --cli "$PWD/tools/FengquDB.CodeGen/bin/Release/net10.0/fqdb-csharp-codegen.dll" --output "$PWD/build/ci-codegen"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/csharp/TypedSmoke.csproj -c Release -- "$PWD/build/ci-typed-db" $lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix artifacts/sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S tests/cmake-consumer -B build/consumer "-DCMAKE_PREFIX_PATH=$PWD/artifacts/sdk" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/consumer --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $consumer = if ($IsWindows) { "$PWD/build/consumer/Release/cpp_consumer.exe" } else { "$PWD/build/consumer/cpp_consumer" }
          & $consumer "$PWD/artifacts/consumer-example.fdb"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $diagnosticsConsumer = if ($IsWindows) { "$PWD/build/consumer/Release/diagnostics_consumer.exe" } else { "$PWD/build/consumer/diagnostics_consumer" }
          & $diagnosticsConsumer "$PWD/artifacts/consumer-diagnostics.fdb"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $platform = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          $jni = if ($IsWindows) { "$native/fengqudb_jni.dll" } else { "$native/libfengqudb_jni.so" }
          ./scripts/build-client-sdk.ps1 -Platform $platform -NativeDir $native -Codegen $codegen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/codegen/package_verify.py --packages "$PWD/artifacts/client" --output "$PWD/build/ci-client-consumer" --java-bin "$env:JAVA_HOME/bin" --dotnet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python examples/quickstart/main.py --sdk "$PWD/artifacts/client/FengquDB-python-$platform/FengquDB" --root "$PWD/build/ci-quickstart"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build/static -DCMAKE_BUILD_TYPE=Release -DFQDB_SHARED=OFF -DFQDB_BUILD_JNI=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/static --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/static -C Release -R 'paged_store_sdk|shared_c_abi|wire|logging|diagnostics' --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: FengquDB-client-${{ matrix.os }}
          path: artifacts/client/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FengquDB-verification-${{ matrix.os }}
          path: |
            build/Testing/Temporary/
            build/ci-client-consumer/*.log
            build/ci-client-consumer/report.json
            build/ci-bindings/*.log
            build/ci-bindings/report.json
            build/ci-native-codegen/*.log
            build/ci-source-codegen/*.log
            build/ci-codegen/*.log
  android-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ndk: ['23.1.7779620', '27.2.12479018']
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;${{ matrix.ndk }}"
      - name: Android ARM64 shared and static
        shell: bash
        run: |
          for shared in ON OFF; do
            cmake -S . -B "build/android-$shared" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/${{ matrix.ndk }}/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DFQDB_SHARED="$shared" \
              -DBUILD_TESTING=OFF -DFQDB_BUILD_TOOLS=OFF -DFQDB_BUILD_DIAGNOSTICS=ON
            cmake --build "build/android-$shared" --target fengqudb fengqudb_diagnostics --parallel 2
          done
          "$ANDROID_SDK_ROOT/ndk/${{ matrix.ndk }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded build/android-ON/libfengqudb.so
      - uses: actions/upload-artifact@v4
        if: matrix.ndk == '27.2.12479018'
        with:
          name: FengquDB-Unity-Android-arm64
          path: build/android-ON/libfengqudb.so
          if-no-files-found: error
  apple-sdk:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Apple native libraries and verify device/simulator links
        run: sh scripts/build-apple-sdk.sh artifacts/apple-sdk build/apple-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: FengquDB-Apple-SDK
          path: artifacts/apple-sdk
          if-no-files-found: error
  unity-sdk:
    needs: [build, android-compile, apple-sdk]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: FengquDB-client-windows-latest
          path: build/inputs/windows
      - uses: actions/download-artifact@v4
        with:
          name: FengquDB-client-ubuntu-latest
          path: build/inputs/linux
      - uses: actions/download-artifact@v4
        with:
          name: FengquDB-Unity-Android-arm64
          path: build/inputs/android
      - uses: actions/download-artifact@v4
        with:
          name: FengquDB-Apple-SDK
          path: build/inputs/apple
      - name: Assemble one complete Unity folder
        run: >-
          python scripts/assemble-unity-sdk.py --inputs build/inputs
          --output artifacts/unity-sdk
      - name: Verify independent Unity ZIP
        run: >-
          python tests/codegen/package_verify.py --packages artifacts/unity-sdk
          --output build/ci-unity-packages --manifest-only
      - name: Run Unity manual generator from the packaged Plugins folder
        run: >-
          python tests/codegen/package_verify.py
          --sdk artifacts/unity-sdk/FengquDB-unity-win-x64/FengquDB
          --output build/ci-unity-consumer
      - uses: actions/upload-artifact@v4
        with:
          name: FengquDB-Unity-SDK
          path: artifacts/unity-sdk/*.zip
          if-no-files-found: error
