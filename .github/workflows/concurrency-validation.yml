name: concurrency-fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build affected regressions
        run: >-
          cmake -S . -B build/regressions -DCMAKE_BUILD_TYPE=Release
          -DFQDB_BUILD_TOOLS=OFF -DFQDB_BUILD_DIAGNOSTICS=OFF -DBUILD_TESTING=ON
      - run: >-
          cmake --build build/regressions --config Release --parallel 2 --target
          fqdb_store_features_tests fqdb_store_operations_tests fqdb_buffered_submit_tests
      - name: Run affected regressions without extending time windows
        shell: pwsh
        env:
          FQDB_TEST_TRACE: '1'
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $env:FQDB_TEST_PYTHON = (Get-Command python).Source
          $env:FQDB_TEST_CLEANER = "$PWD/tests/store_fixture_cleanup.py"
          $env:FQDB_TEST_OWNED_ROOT = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          ctest --test-dir build/regressions -C Release --output-on-failure --output-junit results.xml -R '^paged_(features|operations|buffered_submit)$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrency-fixtures-${{ matrix.os }}
          path: |
            build/regressions/results.xml
            build/regressions/Testing/Temporary/
